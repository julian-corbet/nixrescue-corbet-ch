name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    # GitHub's own default is 360 minutes. This job's recorded wall clock is 5-8 minutes (p95 is
    # about 8), so ~3x that is the real budget and everything past it is a hang, not slowness --
    # most plausibly a qemu that never reaches multi-user.target inside one of the VM checks.
    # Left at the default, such a hang holds a runner and a concurrency slot for six hours and
    # reports nothing; bounded here, it reports a fast, unambiguous red.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # --all-systems is NOT optional here, and is the whole reason this file spells the command
      # out rather than running a bare `nix flake check`.
      #
      # Without it, `nix flake check` evaluates only the checks for the RUNNER's own system and
      # prints "omitted these incompatible systems" as a warning — then exits 0. Every other system
      # this flake declares goes unevaluated while CI reports green, which is a check that passed
      # having tested nothing. That failure mode is the one this repo exists to make impossible, so
      # it would be absurd to ship it here.
      #
      # `systems` in flake.nix is deliberately narrow so this can be strict: only platforms that
      # can genuinely be evaluated are declared, and all of them really are.
      #
      # --keep-going is the same argument applied one level down. This flake's checks are
      # independent of one another — the eval contract, two nixosTests of different boot paths, a
      # reconciler VM, a shellcheck boundary, an image-fits-its-slot size gate — and Nix's default
      # is to abandon every derivation still outstanding the moment one of them fails. A single
      # broken VM check then hides the state of all the others, and the next run only reveals
      # whichever failure happens to surface first, one round trip at a time. With --keep-going
      # every check that CAN run DOES run and reports its own result, and the build still exits
      # non-zero listing exactly which ones failed. This suppresses nothing: a red check is still
      # red, it simply no longer takes the unrelated checks down with it.
      - name: nix flake check (all systems)
        run: nix flake check --all-systems --keep-going --print-build-logs
